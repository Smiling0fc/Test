<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотографическая история | ViJoy’s</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact-drawer.css">
    <link rel="stylesheet" href="css/maintenance.css">
    <link rel="stylesheet" href="css/journal-pages.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/collection-masonry.css">
    <link rel="stylesheet" href="css/next-story.css">
    <link rel="stylesheet" href="css/collection-issue-meta.css">
    <link rel="stylesheet" href="css/collection-editorial-hero.css">
    <link rel="stylesheet" href="css/page-edges.css">
    <link rel="stylesheet" href="css/editorial-loading-motion.css">
    <link rel="stylesheet" href="css/loading-reserve.css">
    <link rel="stylesheet" href="css/journal-content-width.css">
    <link rel="stylesheet" href="css/editorial-footer.css">
    <link rel="stylesheet" href="css/page-chrome.css">
    <link rel="stylesheet" href="css/action-icons.css">
    <link rel="stylesheet" href="css/photo-story-hover-patch.css">
</head>
<body data-journal-page="collection" data-edge-left="Фотографическая история" data-edge-right="ViJoy’s Journal">
    <header class="header-on-hero">
        <a class="logo" href="./" aria-label="На главную">
            <img src="images/brand/vijoys-logo.svg" alt="ViJoy’s Photo Gallery">
        </a>
        <nav class="glass-menu">
            <ul>
                <li><a href="./">Главная</a></li>
                <li><a href="collections.html">Все коллекции</a></li>
                <li><a href="#contactDrawer" class="contact-link" aria-controls="contactDrawer" aria-expanded="false">Связаться <span aria-hidden="true">→</span></a></li>
            </ul>
        </nav>
    </header>

    <main class="journal-main">
        <section
            id="collectionIssueHero"
            class="collection-issue-hero collection-editorial-hero is-loading"
            aria-live="polite"
            aria-busy="true">
            <div class="collection-issue-media collection-editorial-skeleton-media" aria-hidden="true"></div>

            <div class="collection-issue-copy collection-editorial-skeleton-copy" aria-hidden="true">
                <span class="collection-editorial-skeleton-line is-kicker"></span>
                <span class="collection-editorial-skeleton-line is-issue"></span>
                <span class="collection-editorial-skeleton-line is-title"></span>
                <span class="collection-editorial-skeleton-line is-title is-short"></span>
                <span class="collection-editorial-skeleton-line is-description"></span>
                <span class="collection-editorial-skeleton-line is-description is-short"></span>
                <span class="collection-editorial-skeleton-line is-meta"></span>
                <span class="collection-editorial-skeleton-line is-action"></span>
            </div>
        </section>

        <section id="issueGallery" class="issue-gallery">
            <div id="issueGalleryRoot" class="journal-shell">
                <div class="journal-message">Загружаем фотографии…</div>
            </div>
        </section>
    </main>

    <footer class="site-footer"></footer>

    <section id="maintenanceScreen" class="maintenance-screen" hidden aria-live="polite">
        <div class="maintenance-card">
            <img src="images/brand/vijoys-logo.svg" alt="ViJoy’s">
            <small>Технические работы</small>
            <h1>Сайт скоро вернётся</h1>
            <p>Мы обновляем галерею и готовим новые истории.</p>
            <button type="button">Обновить страницу</button>
        </div>
    </section>

    <script src="js/menu.js"></script>
    <script src="js/publicConfig.js"></script>
    <script src="js/public/PublicApi.js"></script>
    <script src="js/public/EditorialFooter.js"></script>
    <script src="js/public/ContactDrawer.js"></script>
    <script src="js/public/SiteIdentity.js"></script>
    <script src="js/public/PageChrome.js"></script>
    <script src="js/public/MaintenanceMode.js"></script>
    <script src="js/public/GalleryService.js"></script>
    <script src="js/public/EditorialLoadingMotion.js"></script>
    <script src="js/public/PageEdges.js"></script>
    <script src="js/public/JournalPages.js"></script>
    <script src="js/public/CollectionIssueMeta.js"></script>
    <script src="js/public/HeroFocus.js"></script>
    <script src="js/public/CollectionEditorialHero.js"></script>
    <script src="js/public/NextStory.js"></script>
    <script src="js/public/CollectionMasonry.js"></script>
</body>
</html>
